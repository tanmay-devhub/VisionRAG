services:

  visionrag-ollama:
    image: ollama/ollama
    ports:
      - "11435:11434"
    volumes:
      - visionrag_ollama_data:/root/.ollama
    networks:
      - visionrag-network

  visionrag-backend:
    build: ./backend
    ports:
      - "8081:8080"
    depends_on:
      - visionrag-ollama
    env_file: ./backend/.env
    environment:
      - CHROMA_DIR=/app/chroma_db
    volumes:
      - ./static/figures:/app/static/figures
      - visionrag_chroma_data:/app/chroma_db
    networks:
      - visionrag-network

  visionrag-frontend:
    build: ./frontend
    ports:
      - "3001:3000"
    depends_on:
      - visionrag-backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081
    networks:
      - visionrag-network

volumes:
  visionrag_ollama_data:
  visionrag_chroma_data:

networks:
  visionrag-network:
    driver: bridge
